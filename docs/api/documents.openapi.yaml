openapi: 3.1.0
info:
  title: document-svc API
  version: 1.0.0-draft
  description: |
    File uploads and permission-checked downloads. Generated PDFs (CIMH quotes, invoices, commercial invoices,
    Pro Bono invoices, label batches) are created from events and appear here as files.
    Owns no collection: metadata is attached to `orders.files[]` (BSD §5.10); bytes live on `/srv/sia-data/protected`.
servers:
  - url: /api/documents/v1
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: files
  - name: ops
  - name: internal

paths:
  /files:
    post:
      tags: [files]
      summary: Upload a file to a request (staff for all kinds; customers only `signed_agreement` on their own requests while QUOTED, or `payment_proof` on their own PAID request once DELIVERED; stamped with the current quote version)
      description: PDF, JPEG, PNG, WebP; type checked from content (magic bytes); ≤ 20 MB; images re-encoded.
      parameters: [ { $ref: './common.yaml#/components/parameters/CsrfToken' } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, requestId, kind]
              properties:
                file: { type: string, format: binary }
                requestId: { type: string }
                kind: { type: string, enum: [supplier_quote, signed_agreement, payment_proof, upload, commercial_invoice] }
      responses:
        '201':
          description: Stored (attached to the request asynchronously via document.uploaded)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/File' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '413': { description: 'Too large (FILE_TOO_LARGE)', content: { application/problem+json: { schema: { $ref: './common.yaml#/components/schemas/Problem' } } } }
        '415': { description: 'Unsupported type (UNSUPPORTED_FILE_TYPE)', content: { application/problem+json: { schema: { $ref: './common.yaml#/components/schemas/Problem' } } } }
        '422': { description: 'Validation failed, or FILE_INFECTED (quarantined)', content: { application/problem+json: { schema: { $ref: './common.yaml#/components/schemas/Problem' } } } }

  /files/{fileId}:
    parameters: [ { name: fileId, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [files]
      summary: Download a file
      description: |
        Allowed for staff/admin, or a customer who owns the request or belongs to its organisation (checked with order-svc).
        The response body is streamed by nginx via `X-Accel-Redirect`; the service returns only headers.
      parameters:
        - { name: disposition, in: query, schema: { type: string, enum: [inline, attachment], default: inline } }
      responses:
        '200':
          description: File bytes
          headers:
            X-Accel-Redirect: { description: 'Internal path (consumed by nginx, never seen by clients)', schema: { type: string } }
            Content-Disposition: { schema: { type: string } }
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            text/csv: { schema: { type: string } }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
    delete:
      tags: [files]
      summary: Soft-delete an uploaded file (staff, admin; generated documents cannot be deleted)
      parameters: [ { $ref: './common.yaml#/components/parameters/CsrfToken' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 3 } } } } }
      responses:
        '204': { description: Deleted (audit logged) }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }

  /requests/{requestId}/agreement-preview:
    parameters: [ { name: requestId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } } ]
    get:
      tags: [files]
      summary: Preview the agreement a Send quote would email (staff, admin)
      description: |
        Renders the quote agreement from the request's saved quote draft, priced as `send-quote` would price it
        (order-svc `GET /internal/requests/{id}/quote-preview`), marked "Preview · not sent" on every page. Nothing is
        stored, attached or published; each call renders afresh. order-svc's 409/422 are passed on unchanged (they say
        why the draft can't be sent yet).
      responses:
        '200':
          description: The agreement preview
          headers:
            Content-Disposition: { schema: { type: string } }
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
          content:
            application/pdf: { schema: { type: string, format: binary } }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '422': { $ref: './common.yaml#/components/responses/Unprocessable' }
        '503': { $ref: './common.yaml#/components/responses/Unavailable' }

  /requests/{requestId}/invoice-draft:
    parameters: [ { name: requestId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } } ]
    get:
      tags: [files]
      summary: What the invoice builder starts from (staff, admin)
      description: |
        Every priced line of the request (`invoice`) or only its CIMH-stock lines (`commercial_invoice`; supplier items
        ship direct and are invoiced by the supplier); Pro Bono lines at 0.00. Description = "<model number> - <name>".
        Fees = the admin fee (invoice only); shipping = the costs recorded on the parcels (invoice only).
      parameters:
        - { name: kind, in: query, required: true, schema: { $ref: '#/components/schemas/InvoiceKind' } }
      responses:
        '200':
          description: The draft
          content:
            application/json:
              schema:
                type: object
                required: [kind, lines, fees, discount, shipping, recipient]
                properties:
                  kind: { $ref: '#/components/schemas/InvoiceKind' }
                  number: { type: [string, 'null'] }
                  lines: { type: array, items: { $ref: '#/components/schemas/InvoiceLine' } }
                  fees: { type: string }
                  discount: { type: string }
                  shipping: { type: string }
                  recipient: { type: array, items: { type: string }, description: 'Bill-to (invoice) or ship-to (commercial invoice), one row per line' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '422': { $ref: './common.yaml#/components/responses/Unprocessable' }
        '503': { $ref: './common.yaml#/components/responses/Unavailable' }

  /requests/{requestId}/invoice-preview:
    parameters: [ { name: requestId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } } ]
    post:
      tags: [files]
      summary: Preview a staff-built invoice or commercial invoice (staff, admin)
      description: Rendered in the legacy SIA layout and marked "Preview · not sent". Nothing is stored or published.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/InvoiceIn' } }
      responses:
        '200':
          description: The preview
          content:
            application/pdf: { schema: { type: string, format: binary } }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '422': { $ref: './common.yaml#/components/responses/Unprocessable' }
        '503': { $ref: './common.yaml#/components/responses/Unavailable' }

  /requests/{requestId}/invoices:
    parameters: [ { name: requestId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } } ]
    post:
      tags: [files]
      summary: Create a staff-built invoice or commercial invoice (staff, admin)
      description: |
        Renders the PDF, stores it, attaches it to the request (kind `invoice` / `commercial_invoice`) and publishes
        `document.generated` with `notify` (emailCustomer / emailStaff), so notification-svc emails the customer and/or
        the staff `invoice` list. Audited. Can be repeated (a corrected invoice is a new file).
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/InvoiceIn' } }
      responses:
        '201':
          description: The stored file
          content:
            application/json: { schema: { type: object } }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '422': { $ref: './common.yaml#/components/responses/Unprocessable' }
        '503': { $ref: './common.yaml#/components/responses/Unavailable' }

  /internal/labels:
    post:
      tags: [internal]
      summary: Render a unit-label PDF (inventory-svc; service token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [productId, barcodes]
              properties:
                productId: { type: string, minLength: 1, maxLength: 64 }
                productName: { type: [string, 'null'], maxLength: 200 }
                barcodes: { type: array, minItems: 1, maxItems: 200, items: { type: string, minLength: 1, maxLength: 80 } }
      responses:
        '201': { description: 'Stored (staff download it with GET /files/{id})', content: { application/json: { schema: { $ref: '#/components/schemas/File' } } } }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }

  /health/live:
    servers: [{ url: / }]
    get: { tags: [ops], security: [], responses: { '200': { description: Alive, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/Health' } } } } } }
  /health/ready:
    servers: [{ url: / }]
    get:
      tags: [ops]
      security: []
      responses:
        '200': { description: Ready, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/Health' } } } }
        '503': { description: Not ready, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/Health' } } } }

components:
  schemas:
    InvoiceKind: { type: string, enum: [invoice, commercial_invoice] }
    Money: { type: string, pattern: '^\d{1,12}(\.\d{1,2})?$' }
    InvoiceLine:
      type: object
      additionalProperties: false
      required: [description, qty, unitPrice]
      properties:
        lineId: { type: [string, 'null'], maxLength: 64 }
        description: { type: string, minLength: 1, maxLength: 300 }
        qty: { type: integer, minimum: 1, maximum: 100000 }
        unitPrice: { $ref: '#/components/schemas/Money' }
    InvoiceIn:
      type: object
      additionalProperties: false
      required: [kind, number, date, lines]
      properties:
        kind: { $ref: '#/components/schemas/InvoiceKind' }
        number: { type: string, minLength: 1, maxLength: 50 }
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', description: 'YYYY-MM-DD' }
        lines: { type: array, minItems: 1, maxItems: 200, items: { $ref: '#/components/schemas/InvoiceLine' } }
        fees: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        shipping: { $ref: '#/components/schemas/Money' }
        emailCustomer: { type: boolean, default: false }
        emailStaff: { type: boolean, default: false }
    File:
      type: object
      required: [id, requestId, kind, name, mime, size, sha256, uploadedAt]
      properties:
        id: { type: string }
        requestId: { type: [string, 'null'], description: null for label batches }
        kind: { type: string, enum: [supplier_quote, cimh_quote, agreement, signed_agreement, invoice, commercial_invoice, probono_invoice, payment_proof, upload, labels] }
        name: { type: string }
        mime: { type: string }
        size: { type: integer }
        sha256: { type: string }
        uploadedBy: { $ref: './common.yaml#/components/schemas/Actor' }
        uploadedAt: { $ref: './common.yaml#/components/schemas/Timestamp' }
        quoteVersion: { type: [integer, 'null'], description: 'Quote version of a generated agreement / CIMH quote, or the one a signed agreement was uploaded for' }
