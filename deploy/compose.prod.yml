  mongo_url_catalog: { file: "${SECRETS:-./secrets}/mongo_url_catalog" }
  redis_url_catalog: { file: "${SECRETS:-./secrets}/redis_url_catalog" }
  service_secret_catalog: { file: "${SECRETS:-./secrets}/service_secret_catalog" }
  mongo_url_inventory: { file: "${SECRETS:-./secrets}/mongo_url_inventory" }
  redis_url_inventory: { file: "${SECRETS:-./secrets}/redis_url_inventory" }
  service_secret_inventory: { file: "${SECRETS:-./secrets}/service_secret_inventory" }
  app_kafka_inventory: { file: "${SECRETS:-./secrets}/app_kafka_inventory" }
  mongo_url_order: { file: "${SECRETS:-./secrets}/mongo_url_order" }
  redis_url_order: { file: "${SECRETS:-./secrets}/redis_url_order" }
  service_secret_order: { file: "${SECRETS:-./secrets}/service_secret_order" }
  app_kafka_order: { file: "${SECRETS:-./secrets}/app_kafka_order" }
  redis_url_media: { file: "${SECRETS:-./secrets}/redis_url_media" }
  redis_url_document: { file: "${SECRETS:-./secrets}/redis_url_document" }
  service_secret_document: { file: "${SECRETS:-./secrets}/service_secret_document" }
  app_kafka_document: { file: "${SECRETS:-./secrets}/app_kafka_document" }
  jwt_private_key: { file: "${SECRETS:-./secrets}/jwt_private_key" }
  data_key: { file: "${SECRETS:-./secrets}/data_key" }
  code_pepper: { file: "${SECRETS:-./secrets}/code_pepper" }
  service_secrets: { file: "${SECRETS:-./secrets}/service_secrets" }
  smtp_password: { file: "${SECRETS:-./secrets}/smtp_password" }
  kafka_admin: { file: "${SECRETS:-./secrets}/kafka_admin" }
  kafka_identity: { file: "${SECRETS:-./secrets}/kafka_identity" }
  kafka_catalog: { file: "${SECRETS:-./secrets}/kafka_catalog" }
  kafka_inventory: { file: "${SECRETS:-./secrets}/kafka_inventory" }
  kafka_order: { file: "${SECRETS:-./secrets}/kafka_order" }
  kafka_document: { file: "${SECRETS:-./secrets}/kafka_document" }
  kafka_notification: { file: "${SECRETS:-./secrets}/kafka_notification" }
  kafka_media: { file: "${SECRETS:-./secrets}/kafka_media" }
  kafka_relay: { file: "${SECRETS:-./secrets}/kafka_relay" }
  app_kafka_relay: { file: "${SECRETS:-./secrets}/app_kafka_relay" }     # copy owned by uid 10001
  app_kafka_identity: { file: "${SECRETS:-./secrets}/app_kafka_identity" }
  app_kafka_catalog: { file: "${SECRETS:-./secrets}/app_kafka_catalog" }
  app_kafka_media: { file: "${SECRETS:-./secrets}/app_kafka_media" }
