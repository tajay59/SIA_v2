networks:
  edge: { name: sia-prod-edge }
  app: { name: sia-prod-app, internal: true }
  data: { name: sia-prod-data, internal: true }
  smtp: { name: sia-prod-smtp }   # egress to the CIMH mail relay only (host firewall, INFRASTRUCTURE §3.3)
