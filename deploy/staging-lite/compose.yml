# Staging-lite on the shared demo server (84.247.187.64): https://sia.hashiz.store, https://store.hashiz.store
# Not the CIMH staging from INFRASTRUCTURE.md (that needs the CIMH host). Small on purpose: the box is shared
# with other live stacks and has ~2 GB free, so every container has a hard mem_limit (total ~1.3 GB).
# Synthetic data only: never load CIMH personal data here (Barbados DPA 2019).
#
# Edge: printit-nginx (ports 80/443, TLS) -> sia-gateway (alias on kong-net) -> services.
# Install/update: deploy/staging-lite/deploy.sh (run from v2/ on a dev machine with ssh access).
name: sia-staging

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  user: "10001"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: { driver: local, options: { max-size: "10m", max-file: "3" } }

secrets:
  jwt_private_key: { file: ./secrets/jwt_private_key.pem }
  data_key: { file: ./secrets/data_key }
  code_pepper: { file: ./secrets/code_pepper }
  service_secrets: { file: ./secrets/service_secrets }

services:
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy.inc:/etc/nginx/conf.d/proxy.inc:ro
      - ./site:/usr/share/nginx/sia-site:ro
    networks:
      internal: {}
      kong-net: { aliases: [sia-gateway] }
    depends_on: [identity-svc]
    mem_limit: 48m
    cpus: 0.25
    logging: { driver: local, options: { max-size: "10m", max-file: "3" } }

  identity-svc:
    image: cimh/identity-svc:staging
    <<: *hardening
    command: ["gunicorn", "identity_svc.main:build_app()", "-k", "uvicorn.workers.UvicornWorker",
              "-b", "0.0.0.0:8000", "-w", "1", "--access-logfile", "-", "--worker-tmp-dir", "/tmp"]
    environment:
      MONGO_URL: mongodb://mongo:27017/?replicaSet=rs0
      REDIS_URL: redis://redis:6379/0
      JWT_ISSUER: https://sia.hashiz.store
      JWT_AUDIENCE: cimh-stores
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      DATA_KEY_FILE: /run/secrets/data_key
      CODE_PEPPER_FILE: /run/secrets/code_pepper
      SERVICE_SECRETS_FILE: /run/secrets/service_secrets
      COOKIE_SECURE: "true"
      HIBP_ENABLED: "true"
      LOG_LEVEL: INFO
    secrets: [jwt_private_key, data_key, code_pepper, service_secrets]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal]
    mem_limit: 224m
    cpus: 0.5

  outbox-relay-identity:
    image: cimh/identity-svc:staging
    <<: *hardening
    command: ["python", "-m", "cimh_common.relay_main"]
    environment:
      MONGO_URL: mongodb://mongo:27017/?replicaSet=rs0
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP: kafka:9092
      RELAY_NAME: identity
      RELAY_COLLECTIONS: accounts
      RELAY_TOPICS: "user.=identity.user.events,audit.=audit.events"
    healthcheck: { disable: true }
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      mongo: { condition: service_healthy }
    networks: [internal]
    mem_limit: 96m
    cpus: 0.1

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "const h = db.hello(); if (h.isWritablePrimary) quit(0); if (!h.setName) { try { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) } catch (e) {} } quit(1)"]
      interval: 10s
      timeout: 15s
      start_period: 30s
      retries: 20
    volumes: [mongo-data:/data/db]
    networks: [internal]
    mem_limit: 448m
    cpus: 0.5
    logging: { driver: local, options: { max-size: "10m", max-file: "3" } }

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "48mb", "--maxmemory-policy", "noeviction"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s }
    volumes: [redis-data:/data]
    networks: [internal]
    mem_limit: 80m
    cpus: 0.25

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
    volumes: [kafka-data:/var/lib/kafka/data]
    networks: [internal]
    mem_limit: 480m
    cpus: 0.5
    logging: { driver: local, options: { max-size: "10m", max-file: "3" } }

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on: [kafka]
    entrypoint: ["/bin/bash", "/topics/create-topics.sh"]
    environment: { BOOTSTRAP: "kafka:9092", REPLICATION: "1" }
    volumes: [./create-topics.sh:/topics/create-topics.sh:ro]
    networks: [internal]
    mem_limit: 256m
    restart: "no"

volumes:
  mongo-data:
  redis-data:
  kafka-data:

networks:
  internal: {}
  kong-net: { external: true }
