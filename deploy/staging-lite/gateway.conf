# sia-gateway: routes for staging-lite. The edge (printit-nginx) terminates TLS and forwards here.
# Mirrors INFRASTRUCTURE §4 nginx rules: /internal/* is never routed, auth endpoints are rate limited,
# the real client IP comes from the edge's X-Real-IP.

set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
real_ip_header X-Real-IP;

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_status 429;

server_tokens off;
client_max_body_size 1m;

map $request_uri $is_internal { default 0; ~^/api/[^/]+/v1/internal/ 1; }

upstream identity { server identity-svc:8000; keepalive 8; }

# Shared header set for both hosts.
map $host $csp {
  default "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'";
}

server {
  listen 80 default_server;
  server_name sia.hashiz.store;

  include /etc/nginx/conf.d/headers.inc;

  if ($is_internal) { return 404; }

  location ~ ^/api/identity/v1/auth/(login|register|verify|password) {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://identity;
    include /etc/nginx/conf.d/proxy.inc;
  }

  location /api/identity/v1/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://identity;
    include /etc/nginx/conf.d/proxy.inc;
  }

  location = /health { default_type application/json; return 200 '{"status":"ok"}'; }

  location /status/ {
    root /usr/share/nginx/sia-site;
    try_files $uri /status/index.html;
  }

  # Hashed build assets never change; index.html is always revalidated (DESIGN/INFRA §5.4 caching).
  # add_header in a location drops the server-level ones, so the security headers are included again.
  location /assets/ {
    root /usr/share/nginx/sia-site/sia;
    include /etc/nginx/conf.d/headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    root /usr/share/nginx/sia-site/sia;
    include /etc/nginx/conf.d/headers.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}

server {
  listen 80;
  server_name store.hashiz.store;

  include /etc/nginx/conf.d/headers.inc;

  if ($is_internal) { return 404; }

  # SHOP talks to the same APIs (same-site cookies are scoped per host, so each app logs in itself).
  location ~ ^/api/identity/v1/auth/(login|register|verify|password) {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://identity;
    include /etc/nginx/conf.d/proxy.inc;
  }

  location /api/identity/v1/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://identity;
    include /etc/nginx/conf.d/proxy.inc;
  }

  # Hashed build assets never change; index.html is always revalidated (DESIGN/INFRA §5.4 caching).
  # add_header in a location drops the server-level ones, so the security headers are included again.
  location /assets/ {
    root /usr/share/nginx/sia-site/store;
    include /etc/nginx/conf.d/headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    root /usr/share/nginx/sia-site/store;
    include /etc/nginx/conf.d/headers.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
