# sia-gateway: routes for staging-lite. The edge (printit-nginx) terminates TLS and forwards here.
# Mirrors INFRASTRUCTURE §4 nginx rules: /internal/* is never routed, auth endpoints are rate limited,
# the real client IP comes from the edge's X-Real-IP.

set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
real_ip_header X-Real-IP;

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status 429;

server_tokens off;
client_max_body_size 1m;

# Compression for the web app files only (Lighthouse 2026-11-25: ~1.2 MB of JS/CSS went out uncompressed and
# phones waited ~8 s for content). Switched on in the static locations below, not for /api/: compressing
# responses that carry tokens next to user-supplied text invites BREACH, and API answers are small.
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/css application/javascript text/javascript application/json image/svg+xml font/ttf application/xml text/plain;

# $uri, not $request_uri: $uri is decoded and normalised, so /%69nternal/ and internal%2F are caught too (pen test 2026-11).
map $uri $is_internal { default 0; ~*^/api/[^/]+/v1/internal(/|$) 1; }

upstream identity { server identity-svc:8000; keepalive 8; }
upstream catalog { server catalog-svc:8000; keepalive 8; }
upstream push { server catalog-push:8000; }
upstream inventory { server inventory-svc:8000; keepalive 8; }
upstream orders { server order-svc:8000; keepalive 8; }
upstream documents { server document-svc:8000; keepalive 8; }

# Shared header set for both hosts.
map $host $csp {
  default "default-src 'self'; script-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; connect-src 'self' wss://sia.hashiz.store wss://store.hashiz.store";
}

server {
  listen 80 default_server;
  server_name sia.hashiz.store;

  include /etc/nginx/conf.d/headers.inc;

  if ($is_internal) { return 404; }

  location ~ ^/api/identity/v1/auth/(login|register|verify|password) {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://identity;
    include /etc/nginx/conf.d/proxy.inc;
  }

  location /api/identity/v1/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://identity;
    include /etc/nginx/conf.d/proxy.inc;
  }

  # Announcement socket (plan 2026-11-23): WebSocket to catalog-push, idle timeout above its 25 s ping.
  location = /api/catalog/v1/announcements/stream {
    limit_conn perip 20;
    proxy_pass http://push;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 75s;
    proxy_buffering off;
  }

  location /api/catalog/v1/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://catalog;
    include /etc/nginx/conf.d/proxy.inc;
  }

  # Image uploads: up to 10 files of 20 MB (catalog.openapi.yaml); the service checks each file.
  location ~ ^/api/catalog/v1/products/[^/]+/images$ {
    limit_req zone=api burst=10 nodelay;
    client_max_body_size 210m;
    proxy_request_buffering off;
    proxy_pass http://catalog;
    include /etc/nginx/conf.d/proxy.inc;
  }

  # Staff only (SIA, mobile): never routed on the SHOP host.
  location /api/inventory/v1/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://inventory;
    include /etc/nginx/conf.d/proxy.inc;
  }

  # Processed product images (WebP, written by media-worker). File names are unique: cache forever.
  # Carts and requests: customers (SHOP) and staff (SIA). Service-only paths are never routed.
  location /api/orders/v1/internal/ { return 404; }
  location /api/orders/v1/ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://orders;
    include /etc/nginx/conf.d/proxy.inc;
  }

  # Files (P6): uploads up to 20 MB; downloads are answered by document-svc with X-Accel-Redirect, and only
  # then does nginx read the file from /_protected/ (internal: a client can never request it directly).
  location /api/documents/v1/internal/ { return 404; }
  location /api/documents/v1/ {
    limit_req zone=api burst=20 nodelay;
    client_max_body_size 21m;
    proxy_request_buffering off;
    proxy_pass http://documents;
    include /etc/nginx/conf.d/proxy.inc;
  }
  location /_protected/ {
    internal;
    alias /srv/sia-data/protected/;
    include /etc/nginx/conf.d/headers.inc;
    add_header Cache-Control "private, no-store" always;
  }

  location /media/products/ {
    alias /srv/sia-data/public/products/;
    include /etc/nginx/conf.d/headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    types { image/webp webp; }
    default_type application/octet-stream;
  }

  location = /health { default_type application/json; return 200 '{"status":"ok"}'; }

  location /status/ {
    root /usr/share/nginx/sia-site;
    try_files $uri /status/index.html;
  }

  # Hashed build assets never change; index.html is always revalidated (DESIGN/INFRA §5.4 caching).
  # add_header in a location drops the server-level ones, so the security headers are included again.
  location /assets/ {
    root /usr/share/nginx/sia-site/sia;
    gzip on;
    gzip_static on;  # serve the .gz the build stored (level 9), else compress on the fly
    include /etc/nginx/conf.d/headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    root /usr/share/nginx/sia-site/sia;
    gzip on;
    gzip_static on;  # serve the .gz the build stored (level 9), else compress on the fly
    include /etc/nginx/conf.d/headers.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}

