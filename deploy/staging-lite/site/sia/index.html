<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIA staging</title>
<style>
  :root { --bg:#F5F7FA; --surface:#FFFFFF; --ink:#0F1A24; --muted:#53606C; --primary:#006FA8; --line:#E1E6EC; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0D1117; --surface:#161B22; --ink:#E6EDF3; --muted:#9AA7B4; --primary:#5CC2FF; --line:#2A323C; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/22px system-ui, sans-serif; }
  main { max-width:640px; margin:64px auto; padding:0 16px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:24px; }
  h1 { font-size:22px; line-height:30px; margin:0 0 8px; }
  p { color:var(--muted); margin:8px 0; }
  code { font-family:ui-monospace, monospace; font-size:13px; }
  a { color:var(--primary); }
  .ok { color:#1A7F37; } .bad { color:#B42318; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>SIA v2 staging</h1>
    <p>Staff app for CIMH Stores. The screens arrive in a later phase; the identity API is live.</p>
    <p>Identity service: <strong id="status">checking…</strong></p>
    <p>Public keys: <a href="/api/identity/v1/.well-known/jwks.json"><code>/api/identity/v1/.well-known/jwks.json</code></a></p>
    <p>Synthetic test data only.</p>
  </div>
</main>
<script src="/status.js" defer></script>
</body>
</html>
