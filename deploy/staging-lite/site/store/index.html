<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CIMH Store staging</title>
<style>
  :root { --bg:#F5F7FA; --surface:#FFFFFF; --ink:#0F1A24; --muted:#53606C; --line:#E1E6EC; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0D1117; --surface:#161B22; --ink:#E6EDF3; --muted:#9AA7B4; --line:#2A323C; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/24px system-ui, sans-serif; }
  main { max-width:640px; margin:64px auto; padding:0 16px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:24px; }
  h1 { font-size:22px; line-height:30px; margin:0 0 8px; }
  p { color:var(--muted); margin:8px 0; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>CIMH Store (v2 staging)</h1>
    <p>The new customer store is being built. This address will host it for testing.</p>
    <p>Synthetic test data only.</p>
  </div>
</main>
</body>
</html>
