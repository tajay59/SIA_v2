# Phase 1 of the first install only: answers ACME challenges so certbot (webroot) can issue
# sia.hashiz.store without stopping printit-nginx. Replaced by edge-site.conf right after.
server {
  listen 80;
  server_name sia.hashiz.store store.hashiz.store;

  location ^~ /.well-known/acme-challenge/ {
    root /etc/nginx/sites/acme;
    default_type text/plain;
  }

  location / {
    return 503;
  }
}
