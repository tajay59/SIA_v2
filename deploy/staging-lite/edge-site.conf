# CIMH Stores v2 staging-lite on the shared server's edge Nginx (container printit-nginx, which loads
# /srv/edge-sites/*.conf). Installed by deploy/staging-lite/deploy.sh as /srv/edge-sites/cimh-stores-staging.conf.
#
# Certificate: /etc/letsencrypt/live/sia.hashiz.store (both names), from the server's certbot using the
# WEBROOT method (/srv/edge-sites/acme), so issuing/renewing never stops printit-nginx. Deploy hook:
# docker exec printit-nginx nginx -s reload.
#
# The edge only terminates TLS and passes requests on; sia-gateway (alias on kong-net) does routing,
# headers and rate limits.

server {
  listen 80;
  server_name sia.hashiz.store store.hashiz.store;

  location ^~ /.well-known/acme-challenge/ {
    root /etc/nginx/sites/acme;
    default_type text/plain;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name sia.hashiz.store store.hashiz.store;

  ssl_certificate /etc/letsencrypt/live/sia.hashiz.store/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/sia.hashiz.store/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000" always;
  client_max_body_size 21m;  # document uploads are capped at 20 MB by document-svc

  location / {
    set $sia_gateway sia-gateway:80;
    proxy_pass http://$sia_gateway;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }
}
