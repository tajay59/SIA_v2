# Developer stack (INFRASTRUCTURE §4). Run from v2/:
#   docker compose -f deploy/compose.dev.yml up -d --build
#   docker compose -f deploy/compose.dev.yml --profile kafka up -d   # add Kafka
# Endpoints: hello http://localhost:18000/api/hello/v1/greeting, Prometheus http://localhost:19090,
# Alertmanager http://localhost:19093, Mailpit (captured alert emails) http://localhost:18025
# Dev only: no TLS, no auth on Mongo/Redis. Never reuse these settings in staging/production.

name: sia-dev

x-hardening: &hardening
  read_only: true
  tmpfs: [/tmp]
  user: "10001"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      # Initialise a single-member replica set on first start (change streams need one).
      # Healthy only once this node is the writable primary.
      test: ["CMD", "mongosh", "--quiet", "--eval", "const h = db.hello(); if (h.isWritablePrimary) quit(0); if (!h.setName) { try { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) } catch (e) {} } quit(1)"]
      interval: 5s
      timeout: 15s
      start_period: 20s
      retries: 20
    volumes: [mongo-data:/data/db]
    mem_limit: 1g

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
    mem_limit: 192m

  kafka:
    profiles: [kafka]
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    mem_limit: 1g

  hello-svc:
    build:
      context: ..
      dockerfile: services/hello-svc/Dockerfile
      args: { APP_VERSION: dev }
    image: cimh/hello-svc:dev
    <<: *hardening
    environment:
      MONGO_URL: mongodb://mongo:27017/?replicaSet=rs0
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: DEBUG
    ports: ["127.0.0.1:18000:8000"]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    mem_limit: 256m
    cpus: 0.5

  identity-svc:
    build:
      context: ..
      dockerfile: services/identity-svc/Dockerfile
      args: { APP_VERSION: dev }
    image: cimh/identity-svc:dev
    <<: *hardening
    environment:
      MONGO_URL: mongodb://mongo:27017/?replicaSet=rs0
      REDIS_URL: redis://redis:6379/0
      COOKIE_SECURE: "false"          # dev runs over http
      HIBP_ENABLED: "false"           # no internet calls from dev
      SERVICE_SECRETS: "notification=dev-notification-secret,order=dev-order-secret"
      LOG_LEVEL: DEBUG
    ports: ["127.0.0.1:18001:8000"]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    mem_limit: 256m
    cpus: 0.5

  prometheus:
    image: prom/prometheus:v3.1.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=3d"]
    volumes:
      - ./prometheus/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    ports: ["127.0.0.1:19090:9090"]
    mem_limit: 512m

  alertmanager:
    image: prom/alertmanager:v0.28.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes: [./prometheus/alertmanager.dev.yml:/etc/alertmanager/alertmanager.yml:ro]
    ports: ["127.0.0.1:19093:9093"]
    mem_limit: 128m

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["127.0.0.1:18025:8025"]
    mem_limit: 128m

volumes:
  mongo-data:
