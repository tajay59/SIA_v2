# mongod for all three replica-set members (INFRASTRUCTURE §5.1). Cache size is set per member on the
# command line (--wiredTigerCacheSizeGB: 6 on sia-host, 3 on the Pis).
storage:
  dbPath: /data/db
net:
  port: 27017
  bindIpAll: true          # the container port is only published on the VLAN IP (compose)
  tls:
    mode: requireTLS
    certificateKeyFile: /run/secrets/mongo.pem
    CAFile: /run/secrets/ca.pem
    allowConnectionsWithoutCertificates: true   # services authenticate with SCRAM; members with the keyfile
security:
  authorization: enabled
  keyFile: /run/secrets/mongo_keyfile
  clusterAuthMode: keyFile
replication:
  replSetName: rs0
setParameter:
  authenticationMechanisms: SCRAM-SHA-256
operationProfiling:
  mode: slowOp
  slowOpThresholdMs: 200
