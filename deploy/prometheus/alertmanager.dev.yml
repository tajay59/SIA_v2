# Dev: alerts go to Mailpit (http://localhost:18025). Production uses alertmanager.yml.tmpl, rendered by deploy/scripts/render-config.sh (Gmail SMTP).
route:
  receiver: ops-email
  group_by: [alertname, service]
  group_wait: 10s
  repeat_interval: 4h
receivers:
  - name: ops-email
    email_configs:
      - to: ops@example.test
        from: alerts@example.test
        smarthost: mailpit:1025
        require_tls: false
