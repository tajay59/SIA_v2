# TR-OBS-3 alert rules. Security events come from security_events_total (identity-svc, document-svc),
# unexpected errors from unhandled_exceptions_total (every service), certificates from the blackbox exporter.
groups:
  - name: services
    rules:
      - alert: ServiceDown
        expr: up{job="services"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.instance }} is not responding to scrapes" }

      - alert: HighErrorRate
        expr: |
          sum by (service) (rate(http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum by (service) (rate(http_requests_total[5m])), 1e-9) > 0.01
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.service }} 5xx rate above 1%" }

      - alert: SlowP95
        expr: |
          histogram_quantile(0.95, sum by (service, le) (rate(http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.service }} p95 latency above 500 ms" }

  - name: security
    rules:
      - alert: FailedLoginsHigh
        expr: sum(rate(security_events_total{event="login_failed"}[2m])) * 60 > 20
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "More than 20 failed logins per minute ({{ $value | humanize }}/min): password guessing?" }
      - alert: AdminLockedOut
        expr: sum(increase(security_events_total{event="account_locked",role="admin"}[5m])) > 0
        labels: { severity: critical }
        annotations: { summary: "An administrator account was locked after repeated failed logins" }
      - alert: AdminLoginNewIp
        expr: sum(increase(security_events_total{event="admin_login_new_ip"}[5m])) > 0
        labels: { severity: warning }
        annotations: { summary: "An administrator signed in from a new IP address (check the audit log, A-20)" }
      - alert: RefreshTokenReuse
        expr: sum(increase(security_events_total{event="token_reuse"}[5m])) > 0
        labels: { severity: warning }
        annotations: { summary: "A refresh token was reused: possible stolen session (the session family was revoked)" }
      - alert: MalwareUploaded
        expr: sum(increase(security_events_total{event="malware_detected"}[5m])) > 0
        labels: { severity: critical }
        annotations: { summary: "ClamAV found malware in an upload; the file is quarantined (document-svc)" }
      - alert: NewExceptionType
        # A (service, exception type) pair that did not exist a day ago.
        expr: count by (service, type) (unhandled_exceptions_total) unless count by (service, type) (unhandled_exceptions_total offset 1d)
        labels: { severity: warning }
        annotations: { summary: "New unhandled error {{ $labels.type }} in {{ $labels.service }}" }
      - alert: CertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) < 14 * 86400
        labels: { severity: warning }
        annotations: { summary: "Certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}: is certbot renewing?" }
      - alert: SiteUnreachable
        expr: probe_success{job="blackbox"} == 0
        for: 3m
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.instance }} is not reachable over HTTPS" }

  - name: messaging
    rules:
      - alert: DlqNotEmpty
        expr: sum by (topic) (kafka_topic_partition_current_offset{topic=~".*\\.dlq"}) > 0
        labels: { severity: warning }
        annotations: { summary: "Dead-letter topic {{ $labels.topic }} has messages" }
      - alert: ConsumerLagHigh
        expr: sum by (consumergroup, topic) (kafka_consumergroup_lag) > 1000
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.consumergroup }} lag on {{ $labels.topic }} > 1000" }
      - alert: OutboxBacklog
        # Reported by the owning services (not the relay), so a stopped relay still fires this. The relay
        # normally publishes within seconds (change stream) and sweeps every 30 s.
        expr: max by (service, collection) (outbox_oldest_event_age_seconds) > 300
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "Outbox of {{ $labels.collection }} not published for {{ $value | humanizeDuration }}: is its outbox relay running?" }

  - name: data
    rules:
      - alert: ReplicaSetMemberDown
        expr: mongodb_rs_members_health == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "MongoDB replica set member {{ $labels.member_idx }} is down" }

  - name: host
    rules:
      - alert: HostMemoryHigh
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.85
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.instance }} memory above 85%" }
      - alert: DiskAbove80
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes) > 0.80
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.instance }} {{ $labels.mountpoint }} above 80%" }
      - alert: HostRebooted
        expr: time() - node_boot_time_seconds < 600
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.instance }} rebooted; Pis need a manual LUKS unlock" }
