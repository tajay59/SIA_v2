# API routes shared by the SHOP and SIA hosts. Upstreams are Docker DNS names resolved at request time
# (resolver in the http block), so scaled replicas are spread and a restarted container is found again.
# /internal/* never gets here: the server block refuses it on the decoded URI first.

location ~ ^/api/identity/v1/auth/(login|register|verify|password) {
  limit_req zone=auth burst=5 nodelay;
  set $up identity-svc:8000;
  proxy_pass http://$up;
  include /etc/nginx/snippets/proxy.conf;
}
location /api/identity/v1/ {
  limit_req zone=api burst=40 nodelay;
  set $up identity-svc:8000;
  proxy_pass http://$up;
  include /etc/nginx/snippets/proxy.conf;
}
location /api/catalog/v1/ {
  limit_req zone=api burst=40 nodelay;
  set $up catalog-svc:8000;
  proxy_pass http://$up;
  include /etc/nginx/snippets/proxy.conf;
}
# Image uploads: up to 10 files of 20 MB (catalog.openapi.yaml); the service checks each file.
location ~ ^/api/catalog/v1/products/[^/]+/images$ {
  limit_req zone=api burst=10 nodelay;
  client_max_body_size 210m;
  proxy_request_buffering off;
  set $up catalog-svc:8000;
  proxy_pass http://$up;
  include /etc/nginx/snippets/proxy.conf;
}
location /api/orders/v1/ {
  limit_req zone=api burst=20 nodelay;
  set $up order-svc:8000;
  proxy_pass http://$up;
  include /etc/nginx/snippets/proxy.conf;
}
# Uploads up to 20 MB; downloads come back from document-svc as X-Accel-Redirect to /_protected/.
location /api/documents/v1/ {
  limit_req zone=api burst=20 nodelay;
  client_max_body_size 21m;
  proxy_request_buffering off;
  set $up document-svc:8000;
  proxy_pass http://$up;
  include /etc/nginx/snippets/proxy.conf;
}
location /_protected/ {
  internal;
  alias /srv/sia-data/protected/;
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control "private, no-store" always;
}
# Processed product images (WebP from media-worker); unique names, so cached for 30 days (INFRA §5.4).
location /media/products/ {
  alias /srv/sia-data/public/products/;
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control "public, max-age=2592000, immutable" always;
  types { image/webp webp; }
  default_type application/octet-stream;
}
location = /health { default_type application/json; return 200 '{"status":"ok"}'; }
location /.well-known/acme-challenge/ { root /var/www/certbot; }
