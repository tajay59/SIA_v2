# Redis for revocation, sessions, rate limits, idempotency keys, processed-event ids, locks (INFRASTRUCTURE §5.3).
# Only reachable on the internal `data` network. Users come from /run/secrets/redis_users.acl
# (rendered by deploy/redis/render-acl.sh); the default user is disabled there.
bind 0.0.0.0
protected-mode yes
port 6379
dir /data
appendonly yes
appendfsync everysec
maxmemory 384mb
# Revocations and sessions must never be evicted: fail writes instead (alerted on).
maxmemory-policy noeviction
aclfile /run/secrets/redis_users.acl
# Dangerous commands are not granted to any service user in the ACL; this is defence in depth.
rename-command DEBUG ""
