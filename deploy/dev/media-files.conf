# Dev only: serves processed images like the gateway does in staging/production (/media/products/, /media/announcements/).
server {
  listen 8080;
  server_tokens off;
  location /media/products/ {
    alias /srv/sia-data/public/products/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    types { image/webp webp; }
    default_type application/octet-stream;
  }
  # Announcement pictures and backgrounds (media-worker, target announcement; 2026-11-26).
  location /media/announcements/ {
    alias /srv/sia-data/public/announcements/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    types { image/webp webp; }
    default_type application/octet-stream;
  }
  location / { return 404; }
}
