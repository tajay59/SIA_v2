# CI gates (TEST_STRATEGY §9). PR: lint, types, unit, integration, contract, authz, scans.
# main: build images -> Trivy -> cosign sign -> deploy staging-lite (kw-server) over SSH from a GitHub-hosted runner.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"

jobs:
  python:
    name: python (lint, types, unit, authz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/py-common -e services/hello-svc -e services/identity-svc -e services/catalog-svc -e services/media-worker -e services/inventory-svc
          pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy (strict)
        run: mypy
      - name: Unit tests + coverage (>= 90%)
        run: pytest --cov --cov-report=xml
      - name: Authz matrix covers every endpoint
        run: python tools/authz/check_matrix.py
      - name: API contracts valid
        run: for f in docs/api/*.openapi.yaml; do openapi-spec-validator "$f"; done
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage.xml }

  integration:
    name: integration (testcontainers)
    # MongoDB 8.0 won't start on kernel 6.19-7.0.13 (SERVER-125742); ubuntu-latest is in that range.
    runs-on: ubuntu-22.04
    needs: python
    steps:
      - run: uname -r
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: |
          pip install -e packages/py-common -e services/hello-svc -e services/identity-svc -e services/catalog-svc -e services/media-worker -e services/inventory-svc -r requirements-dev.txt
          # Real Mongo replica set, Redis and Kafka in containers (tests/integration).
          pytest -m integration --no-cov

  web:
    name: web (lint, types, unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm run lint --workspaces --if-present
      - run: npm run typecheck --workspaces --if-present
      - run: npm test --workspaces --if-present
      - name: Build SHOP and SIA
        run: npm run build -w @cimh/shop -w @cimh/sia

  mobile:
    name: mobile (unit, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/sia
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: gradle }
      - name: Unit tests, lint (warnings fail), debug and release builds
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-reports
          path: mobile/sia/app/build/reports

  e2e:
    name: e2e (Playwright J-01 J-08 J-11)
    # MongoDB 8.0 won't start on kernel 6.19-7.0.13 (see integration).
    runs-on: ubuntu-22.04
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - name: Dev stack (Mongo RS, Redis, identity, catalog, media files)
        run: docker compose -f deploy/compose.dev.yml up -d --build --wait mongo redis identity-svc catalog-svc media-files
      # Image pipeline for J-10 (catalog relay -> Kafka -> media-worker -> catalog consumer). Started without
      # --wait: kafka-init is a one-shot container.
      - name: Image pipeline (Kafka, relay, media-worker, consumer)
        run: docker compose -f deploy/compose.dev.yml --profile kafka up -d --build outbox-relay-catalog catalog-consumer media-worker
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser journeys
        run: npx playwright test -c tests/e2e-web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          retention-days: 7
          path: |
            playwright-report
            test-results
      - if: failure()
        run: docker compose -f deploy/compose.dev.yml --profile kafka logs --tail 100 identity-svc catalog-svc outbox-relay-catalog media-worker catalog-consumer

  security:
    name: security (SAST, deps, secrets)
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: Bandit + pip-audit
        run: |
          pip install bandit pip-audit
          bandit -q -r packages services -x '*/tests/*'
          pip-audit -r requirements-dev.txt
          pip install -e packages/py-common -e services/hello-svc -e services/identity-svc -e services/catalog-svc -e services/media-worker -e services/inventory-svc && pip-audit --skip-editable
      - name: Semgrep
        run: pipx run semgrep scan --config p/python --config p/owasp-top-ten --error packages services

  images:
    name: build, scan, sign
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [python, integration, web, security]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write }
    strategy:
      matrix:
        service: [hello-svc, identity-svc, catalog-svc, media-worker, inventory-svc]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Trivy (fail on high/critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: sigstore/cosign-installer@v3
      - name: Cosign sign (keyless)
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}

  infra:
    name: infra (scripts, compose files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning deploy/*/*.sh deploy/scripts/*.sh tools/infra/rehearsal/run.sh tools/perf/run_catalog.sh
      - name: actionlint (workflow files)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: compose files render
        env: { KAFKA_CLUSTER_ID: x, VLAN_IP: 127.0.0.1, HELLO_SVC_DIGEST: "sha256:x", IDENTITY_SVC_DIGEST: "sha256:x", CATALOG_SVC_DIGEST: "sha256:x", MEDIA_WORKER_DIGEST: "sha256:x", INVENTORY_SVC_DIGEST: "sha256:x", MONGO_SELF: x, RESTIC_REPOSITORY: x }
        run: |
          for f in deploy/compose.prod.yml deploy/compose.pi.yml deploy/compose.dev.yml; do docker compose -f "$f" config -q; done
          docker volume create sia-rehearsal-secrets && docker compose -f tools/infra/rehearsal/compose.yml config -q

  rehearsal:
    name: platform rehearsal (replica set, Kafka TLS/ACL, Redis ACL, backup/restore)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [infra]
    runs-on: ubuntu-22.04   # kernel: see the integration job
    timeout-minutes: 30
    steps:
      - run: uname -r
      - uses: actions/checkout@v4
      - run: bash tools/infra/rehearsal/run.sh

  deploy-staging:
    # GitHub-hosted runner -> SSH to the staging-lite server (kw-server). The key lives only in the `staging`
    # environment, which only protected branches (main) can use; PR runs never see it.
    name: deploy staging (sia.hashiz.store)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [images, e2e]
    runs-on: ubuntu-latest
    environment: { name: staging, url: "https://sia.hashiz.store" }
    concurrency: { group: deploy-staging, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: SSH access
        env:
          KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN: ${{ secrets.STAGING_KNOWN_HOSTS }}
          HOST: ${{ vars.STAGING_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$KEY" > ~/.ssh/staging && chmod 600 ~/.ssh/staging
          echo "$KNOWN" > ~/.ssh/known_hosts
          {
            echo "Host kw-server"
            echo "  HostName $HOST"
            echo "  User root"
            echo "  IdentityFile ~/.ssh/staging"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
          } > ~/.ssh/config
      - name: Deploy (identity image + SHOP/SIA builds; edge/cert step stays manual)
        run: bash deploy/staging-lite/deploy.sh
      - name: Smoke
        run: |
          for _ in $(seq 1 20); do
            curl -fsS https://sia.hashiz.store/api/identity/v1/.well-known/jwks.json >/dev/null && exit 0; sleep 6
          done
          echo "staging did not come up" >&2; exit 1
      - if: always()
        run: rm -f ~/.ssh/staging
