# CI gates (TEST_STRATEGY §9). PR: lint, types, unit, integration, contract, authz, scans.
# main: build images -> Trivy -> cosign sign -> deploy to staging via the self-hosted runner.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"

jobs:
  python:
    name: python (lint, types, unit, authz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/py-common -e services/hello-svc -e services/identity-svc
          pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy (strict)
        run: mypy
      - name: Unit tests + coverage (>= 90%)
        run: pytest --cov --cov-report=xml
      - name: Authz matrix covers every endpoint
        run: python tools/authz/check_matrix.py
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage.xml }

  integration:
    name: integration (testcontainers)
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: |
          pip install -e packages/py-common -e services/hello-svc -e services/identity-svc -r requirements-dev.txt
          # exit code 5 = no tests collected (none exist until services own data in P2)
          pytest -m integration --no-cov || [ $? -eq 5 ]

  web:
    name: web (lint, types, unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm run lint --workspaces --if-present
      - run: npm run typecheck --workspaces --if-present
      - run: npm test --workspaces --if-present

  security:
    name: security (SAST, deps, secrets)
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: Bandit + pip-audit
        run: |
          pip install bandit pip-audit
          bandit -q -r packages services -x '*/tests/*'
          pip-audit -r requirements-dev.txt
          pip install -e packages/py-common -e services/hello-svc -e services/identity-svc && pip-audit --skip-editable
      - name: Semgrep
        run: pipx run semgrep scan --config p/python --config p/owasp-top-ten --error packages services

  images:
    name: build, scan, sign
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [python, integration, web, security]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write }
    strategy:
      matrix:
        service: [hello-svc]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Trivy (fail on high/critical)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: sigstore/cosign-installer@v3
      - name: Cosign sign (keyless)
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}

  deploy-staging:
    needs: images
    runs-on: [self-hosted, sia-host]
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: deploy }
      - run: deploy/scripts/deploy.sh staging hello-svc "${{ needs.images.outputs.digest }}"
