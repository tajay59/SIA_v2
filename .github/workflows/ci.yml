# CI gates (TEST_STRATEGY §9). PR: lint, types, unit, integration, contract, authz, scans.
# main: build images -> Trivy -> cosign sign -> deploy to staging via the self-hosted runner.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"

jobs:
  python:
    name: python (lint, types, unit, authz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/py-common -e services/hello-svc -e services/identity-svc
          pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy (strict)
        run: mypy
      - name: Unit tests + coverage (>= 90%)
        run: pytest --cov --cov-report=xml
      - name: Authz matrix covers every endpoint
        run: python tools/authz/check_matrix.py
      - name: API contracts valid
        run: for f in docs/api/*.openapi.yaml; do openapi-spec-validator "$f"; done
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage.xml }

  integration:
    name: integration (testcontainers)
    # MongoDB 8.0 won't start on kernel 6.19-7.0.13 (SERVER-125742); ubuntu-latest is in that range.
    runs-on: ubuntu-22.04
    needs: python
    steps:
      - run: uname -r
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: |
          pip install -e packages/py-common -e services/hello-svc -e services/identity-svc -r requirements-dev.txt
          # Real Mongo replica set, Redis and Kafka in containers (tests/integration).
          pytest -m integration --no-cov

  web:
    name: web (lint, types, unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm run lint --workspaces --if-present
      - run: npm run typecheck --workspaces --if-present
      - run: npm test --workspaces --if-present

  security:
    name: security (SAST, deps, secrets)
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: Bandit + pip-audit
        run: |
          pip install bandit pip-audit
          bandit -q -r packages services -x '*/tests/*'
          pip-audit -r requirements-dev.txt
          pip install -e packages/py-common -e services/hello-svc -e services/identity-svc && pip-audit --skip-editable
      - name: Semgrep
        run: pipx run semgrep scan --config p/python --config p/owasp-top-ten --error packages services

  images:
    name: build, scan, sign
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [python, integration, web, security]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write }
    strategy:
      matrix:
        service: [hello-svc, identity-svc]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Trivy (fail on high/critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: sigstore/cosign-installer@v3
      - name: Cosign sign (keyless)
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}

  infra:
    name: infra (scripts, compose files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning deploy/*/*.sh deploy/scripts/*.sh tools/infra/rehearsal/run.sh
      - name: compose files render
        env: { KAFKA_CLUSTER_ID: x, VLAN_IP: 127.0.0.1, HELLO_SVC_DIGEST: "sha256:x", IDENTITY_SVC_DIGEST: "sha256:x", MONGO_SELF: x, RESTIC_REPOSITORY: x }
        run: |
          for f in deploy/compose.prod.yml deploy/compose.pi.yml deploy/compose.dev.yml; do docker compose -f "$f" config -q; done
          docker volume create sia-rehearsal-secrets && docker compose -f tools/infra/rehearsal/compose.yml config -q

  rehearsal:
    name: platform rehearsal (replica set, Kafka TLS/ACL, Redis ACL, backup/restore)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [infra]
    runs-on: ubuntu-22.04   # kernel: see the integration job
    timeout-minutes: 30
    steps:
      - run: uname -r
      - uses: actions/checkout@v4
      - run: bash tools/infra/rehearsal/run.sh

  deploy-staging:
    needs: [images, rehearsal]
    # Runs only once the self-hosted runner on the CIMH host exists: set repo variable SELF_HOSTED_RUNNER=true.
    if: vars.SELF_HOSTED_RUNNER == 'true'
    runs-on: [self-hosted, sia-host]
    environment: staging
    strategy:
      max-parallel: 1
      matrix:
        service: [hello-svc, identity-svc]
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: deploy }
      - name: Deploy the image built from this commit (by digest)
        run: |
          image=ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}
          digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | tr -d '"')
          deploy/scripts/deploy.sh staging ${{ matrix.service }} "$digest"
