[project]
name = "document-svc"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "cimh-common",
  "pydantic>=2.9",
  "uvicorn[standard]>=0.32",
  "gunicorn>=23",
  "httpx>=0.27",
  "python-multipart>=0.0.18",
  "pillow>=11",
  "reportlab>=4.2",
  "aiokafka>=0.11",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
