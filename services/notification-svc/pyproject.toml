[project]
name = "notification-svc"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "cimh-common",
  "httpx>=0.27",
  "aiokafka>=0.11",
  "redis>=5",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
